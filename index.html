<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Arcade</title>
<meta name="description" content="Neon Arcade — eine Sammlung schneller Browser-Arcade-Spiele: Runner, Racer, Shooter, Breakout, Snake und Pong im Neon-Look.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090418'/%3E%3Cpath d='M18 3 7 18h7l-2 11 13-17h-8z' fill='%2300f6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">

  <header class="game-header">
    <h1 class="brand"><span class="brand-neon">NEON<span>ARCADE</span></span><span class="brand-retro">PIXEL<span>QUEST</span></span><span id="activeGameLabel" class="active-game-label"></span></h1>
    <div class="header-right">
      <div class="hud hidden" id="hudRow"></div>
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button">🍄 Retro</button>
    </div>
  </header>

  <div class="game-area">
    <div class="game-wrap" id="gameWrap">
      <canvas id="gameCanvas" width="900" height="400"></canvas>

      <div id="hubOverlay" class="overlay hub-overlay">
        <h2 id="hubTitle">NEON ARCADE</h2>
        <p>Wähle ein Spiel.</p>
        <div id="hubGrid" class="hub-grid"></div>
      </div>

      <div id="startOverlay" class="overlay hidden">
        <h2 id="startTitle">Spiel</h2>
        <p id="startDesc"></p>
        <p class="controls-hint" id="startControls"></p>
        <button id="startBtn" class="stamp-btn">Starten</button>
        <button id="backToHubBtn" class="text-btn">Zurück zur Auswahl</button>
      </div>

      <div id="gameOverOverlay" class="overlay hidden">
        <h2>Run beendet</h2>
        <p class="final-score-line">Score: <b id="finalScore">0</b></p>
        <p class="personal-best-line" id="personalBestLine"></p>
        <div id="highscoreForm" class="highscore-form">
          <label>Wer spielt? (ein Klick trägt direkt ein)</label>
          <div class="quick-names" id="quickNames">
            <button type="button" class="quick-name-btn" data-name="Tim">Tim</button>
            <button type="button" class="quick-name-btn" data-name="Calvin">Calvin</button>
          </div>
          <label for="initials">oder Kürzel eintippen</label>
          <div class="highscore-row">
            <input id="initials" maxlength="3" placeholder="ABC" autocomplete="off">
            <button id="submitScoreBtn" class="stamp-btn small">Eintragen</button>
          </div>
        </div>
        <button id="restartBtn" class="text-btn">Nochmal spielen</button>
        <button id="gameOverBackBtn" class="text-btn">Zurück zur Auswahl</button>
      </div>

      <div id="pauseOverlay" class="overlay hidden">
        <h2>Pausiert</h2>
        <button id="resumeBtn" class="stamp-btn">Weiter</button>
      </div>
    </div>

    <aside class="leaderboard">
      <h3>Bestenliste</h3>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
      <p id="dbStatus" class="status-banner">Verbinde mit Server&hellip;</p>
    </aside>
  </div>

  <footer class="game-footer">
    Neon Arcade &middot; eine Sammlung kleiner Arcade-Spiele
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="shared.js"></script>
<script src="game-runner.js"></script>
<script src="game-drift.js"></script>
<script src="game-strike.js"></script>
<script src="game-breaker.js"></script>
<script src="game-snake.js"></script>
<script src="game-pong.js"></script>
<script>Arcade.ready();</script>
</body>
</html>
